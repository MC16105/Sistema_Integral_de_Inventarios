<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Historial Precios</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>CRUD Historial Precios</h1>

        <input type="text" id="producto"
            placeholder="Producto">

        <input type="number" id="precioAnterior"
            placeholder="Precio anterior">

        <input type="number" id="precioNuevo"
            placeholder="Precio nuevo">

        <input type="date" id="fecha">

        <button onclick="agregarHistorial()">
            Guardar
        </button>

        <table>

            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio anterior</th>
                    <th>Precio nuevo</th>
                    <th>Fecha</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody id="tablaHistorial"></tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
