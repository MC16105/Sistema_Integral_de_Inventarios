<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Proveedores</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

    <h1>CRUD Proveedores</h1>

<input type="text" id="nombreProveedor" placeholder="Nombre de la Empresa">
<input type="text" id="contactoProveedor" placeholder="Nombre del Contacto">
<input type="text" id="telefonoProveedor" placeholder="Teléfono">
<input type="email" id="emailProveedor" placeholder="Correo Electrónico">
<textarea id="direccionProveedor" placeholder="Dirección Completa"></textarea>

    <button onclick="agregarProveedor()">
        Guardar
    </button>

 <table border="1" style="width: 100%; margin-top: 20px;">
    <thead>
        <tr>
            <th>Proveedor</th>
            <th>Contacto</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Dirección</th>
        </tr>
    </thead>
    <tbody id="tablaProveedores">
        </tbody>
</table>

</div>

<script src="script.js"></script>

</body>
</html>
