services:
  # 1. Base de Datos
  db-postgres:
    image: postgres:15-alpine
    container_name: db-postgres
    restart: always
    environment:
      POSTGRES_USER: inventario_user
      POSTGRES_PASSWORD: sii-system123
      POSTGRES_DB: inventario
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sistema-network

  # 2. Backend (Spring Boot)
  backend-spring:
    build: ./Backend  # Asegúrar de que esta sea la carpeta de tu backend
    container_name: backend-spring
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db-postgres
    networks:
      - sistema-network

  # 3. Frontend (Vite)
  frontend-react:
    build: ./frontend-react # Asegúrate de que esta sea la carpeta de tu frontend
    container_name: frontend-react
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend-spring
    networks:
      - sistema-network

volumes:
  postgres_data:

networks:
  sistema-network:
    driver: bridge
